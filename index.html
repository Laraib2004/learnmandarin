<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under the Dynamic Island and home
     indicator; the CSS then pays it back with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>说吧 Shuō Ba — Learn to Speak Mandarin</title>
<meta name="description" content="A free, open, speaking-first Mandarin course. Tone drills, spaced repetition, two-way conversations and real pronunciation feedback — entirely in your browser, no account, no cost.">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

<!-- iOS home-screen install. Safari ignores most of the manifest, so these
     apple-specific tags are what actually make it feel like an app. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shuō Ba">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">

<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar">
  <a class="brand" href="#/">
    <span class="brand-zh">说吧</span>
    <span class="brand-en">Shuō Ba<small>speak, then</small></span>
  </a>
  <div class="topbar-actions">
    <button class="install-btn tappable" id="install" hidden>Install</button>
    <!-- Library and Settings live here on phones, where the tab bar is full. -->
    <a class="icon-btn tappable" href="#/library" data-route="library" aria-label="Library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></svg>
    </a>
    <a class="icon-btn tappable" href="#/settings" data-route="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 2.5a7 7 0 00-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 2.5h4l.4-2.5a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
    </a>
  </div>
</header>

<main id="main" class="main" tabindex="-1">
  <div class="loading">Loading…</div>
</main>

<!-- Bottom tab bar: thumb-reachable on a 6.3" phone, which a top nav is not.
     Becomes a horizontal bar at the top on wide screens (see app.css). -->
<nav class="tabbar" id="nav" aria-label="Main">
  <a href="#/" data-route="">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
    <span>Today</span>
  </a>
  <a href="#/tones" data-route="tones">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h3l3-7 4 14 3-7h5"/></svg>
    <span>Tones</span>
  </a>
  <a href="#/review" data-route="review">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4zM4 10h16"/></svg>
    <span>Review</span>
    <i class="badge" id="due-badge" hidden>0</i>
  </a>
  <a href="#/drill" data-route="drill">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9l6 3M12 21a9 9 0 100-18 9 9 0 000 18z"/></svg>
    <span>Drills</span>
  </a>
  <a href="#/dialogue" data-route="dialogue">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 01-8 8H7l-4 3V12a8 8 0 018-8h2a8 8 0 018 8z"/></svg>
    <span>Talk</span>
  </a>
  <a href="#/speak" data-route="speak">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 013 3v6a3 3 0 01-6 0V6a3 3 0 013-3zM5 11a7 7 0 0014 0M12 18v3"/></svg>
    <span>Speak</span>
  </a>
  <a href="#/library" data-route="library" class="wide-only">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h6a2 2 0 012 2v12a2 2 0 00-2-2H4zM20 5h-6a2 2 0 00-2 2v12a2 2 0 012-2h6z"/></svg>
    <span>Library</span>
  </a>
  <a href="#/settings" data-route="settings" class="wide-only">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 100-6 3 3 0 000 6zM19 12a7 7 0 00-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 00-1.7-1L14.5 3h-4l-.4 2.5a7 7 0 00-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 000 2l-2 1.5 2 3.4 2.3-1a7 7 0 001.7 1l.4 2.5h4l.4-2.5a7 7 0 001.7-1l2.3 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z"/></svg>
    <span>Settings</span>
  </a>
</nav>

<script type="module" src="js/main.js"></script>
</body>
</html>
